framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_gnuboy_probe/>
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
build_flags =
    -D AZ2_ROLE_SCREEN
    -D BOARD_HAS_PSRAM
monitor_speed = 230400

; --- PEANUT-GB (cœur GB de production depuis le 2026-09-25/26) ---
; Etait un probe A/B hors default_envs -- promu cœur de production (voir
; default_envs plus haut et docs/AZ2_MESURE_EMULATEUR_GB_2026-09-25.md) :
; gains mesures 24->50-60fps selon la scene (frame_skip, -O2, jump tables
; restaurees, PEANUT_GB_HIGH_LCD_ACCURACY=0). docs/AZ2_MESURE_EMULATEUR_GB_
; 2026-09-24.md mesure que le cœur Walnut-CGB verifie l'etat CGB a chaque
; cycle CPU (pas de chemin DMG separable), donc un DMG-only compile flag
; dessus n'aurait rien gagne -- Peanut-GB (deltabeard/Peanut-GB, DMG-only
; par conception, vendored dans peanut_gb/) via un backend alternatif,
; gb_emulator_peanut.cpp, qui implemente EXACTEMENT la meme interface que
; gb_emulator.cpp (gb_emulator.h) -- meme main.cpp, meme UI, seul le cœur
; change. gb_emulator.cpp (et donc walnut_cgb/) est exclu ici pour eviter
; toute collision de symboles avec gb_emulator_peanut.cpp ; le sens inverse
; est fait sur env:screen_esp/env:screen_esp_gb_direct plus haut, gardes en
; secours (LSDJ jamais teste sur Peanut-GB, pas encore retires du depot).
[env:screen_esp_peanut_gb_lab]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_screen/>
    -<../src_esp32/az2_screen/gb_emulator.cpp>
    -<../src_esp32/az2_screen/nes_core/> ; voir la meme exclusion sur env:screen_esp
    +<../src_esp32/az2_screen/nes_core/**> ; nes_emulator.cpp est deja inclus
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
lib_extra_dirs = .pio/libdeps/screen_esp
build_flags =
    -D AZ2_ROLE_SCREEN
    -D BOARD_HAS_PSRAM
    -D MINIGB_APU_AUDIO_FORMAT_S16SYS
    -D AUDIO_SAMPLE_RATE=14000
    ; [2026-09-25/26] Distingue Peanut-GB de Walnut-CGB a la compilation
    ; (les deux backends partagent main.cpp) -- sert uniquement au texte
    ; affiche sur la page JEUX (nom du moteur), voir drawGbEmptyPage()/
    ; equivalent dans main.cpp.
    -D AZ2_GB_CORE_PEANUT
    ; [2026-09-25] Le framework Arduino compile par defaut en -Os (taille),
    ; pas -O2 (vitesse) -- flash a 8.8% d'occupation, largement de la marge.
    ; PlatformIO place son propre -Os APRES nos build_flags dans la ligne de
    ; commande (verifie avec pio run -v) : simplement ajouter -O2 ici ne
    ; suffit pas, GCC prend le dernier -O. Il faut retirer -Os explicitement
    ; via build_unflags ci-dessous. Prototype uniquement, ne touche pas la
    ; production (screen_esp_gb_direct).
    -O2
    ; [2026-09-25] Bascule officielle de Peanut-GB (upstream, pas un hack
    ; local) : PEANUT_GB_HIGH_LCD_ACCURACY=1 par defaut simule des details
    ; fins de timing PPU (priorite sprite/fenetre en milieu de ligne). En 0,
    ; rendu plus rapide, potentiellement quelques glitches visuels rares sur
    ; certains jeux qui dependent de ce timing precis -- a verifier a l'œil.
    -D PEANUT_GB_HIGH_LCD_ACCURACY=0
build_unflags =
    -Os
    -fno-jump-tables
    -fno-tree-switch-conversion
    ; [2026-09-25] ESP-IDF force -fno-jump-tables (+ -fno-tree-switch-
    ; conversion) globalement -- le gros switch(opcode) 256 cas du
    ; dispatcheur CPU dans peanut_gb.h (__gb_step_cpu) et les switch
    ; d'adressage memoire (__gb_read/__gb_write) deviennent alors une
    ; chaine de comparaisons au lieu d'une table de saut O(1). Retirer ces
    ; deux flags ne change aucune logique, juste la strategie de generation
    ; de code pour les switch. Prototype uniquement.
monitor_speed = 230400

; --- GB BLIT SUR L'AUTRE COEUR (probe isole, ne touche pas screen_esp_peanut_gb_lab) ---
; [2026-09-27] display_avg_us (~16,4ms, memcpy+esp_cache_msync par bande)
; s'execute aujourd'hui de facon synchrone DANS gb_run_frame(), donc en serie
; avec le coeur CPU+PPU (~6-9ms) sur le meme coeur ESP32 (le "loopTask"
; Arduino, core 1 par defaut -- aucun WiFi/BT dans ce firmware, donc le
; core 0 est libre). Deplacer copie+flush vers une tache dediee sur le
; core 0 paralleliserait les deux couts au lieu de les additionner --
; plafond theorique ~max(9,16.4)=16.4ms au lieu de ~24-27ms, donc pres de
; 60fps possible en X3 au lieu de ~40-50. Env separe expres : double
; framebuffer (AZ2_RGB_Direct, 20/09) avait deja casse le tactile + fait
; decrocher l'USB au premier essai materiel -- garder screen_esp_peanut_gb_lab
; intact comme filet de secours en cas de nouvel echec.
[env:screen_esp_peanut_gb_core_task]
extends = env:screen_esp_peanut_gb_lab
build_flags =
    ${env:screen_esp_peanut_gb_lab.build_flags}
    -D AZ2_GB_DUAL_CORE_BLIT
    -D AZ2_NES_ENABLED

; --- WALNUT-CGB (GBC complet) + BLIT SUR L'AUTRE COEUR ---
; [2026-09-27] Le decoupage core0/core1 valide plus haut (59,76fps en X3
; avec Peanut-GB DMG) parallelise l'affichage (~16,4ms) avec le coeur
; CPU+PPU -- il ne change rien au COUT du coeur lui-meme. Walnut-CGB
; (docs/AZ2_ETUDE_COEURS_EMULATION_GB.md, archive le 24/09 pour Peanut-GB
; DMG-only, la GBC double-speed dans son hot-loop principal etant
; incompressible, voir docs/AZ2_MESURE_EMULATEUR_GB_2026-09-24.md) reste
; le seul coeur GBC-complet deja dans ce depot (walnut_cgb.h,
; WALNUT_FULL_GBC_SUPPORT=1 par defaut) -- moins de risque qu'un port
; SameBoy jamais teste sur cette carte. Sert a mesurer si le nouveau
; budget core1 (~7-10ms de marge mesures en DMG) absorbe le cout reel
; d'un jeu GBC en double-speed, pas juste a l'estimer sur le papier.
[env:screen_esp_walnut_gbc_core_task]
extends = env:screen_esp
build_flags =
    ${env:screen_esp.build_flags}
    -D AZ2_GB_DUAL_CORE_BLIT
    -O2
build_unflags =
    -Os
    -fno-jump-tables
    -fno-tree-switch-conversion

; --- PICO ABANDONNE (2026-09-14) ---
; 3e cerveau tente le 2026-09-13 (clavier : pads, mux LED, encodeurs) --
; abandonne apres un long diagnostic sans resoudre le mux LED (CD74HC4067
; jamais fonctionnel malgre EN/resistance/masses toutes verifiees, voir
; docs/AZ2_CABLAGE_PICO.md). Remplace par une croix + 4 boutons + 3
; encodeurs rotatifs cables DIRECTEMENT sur le Teensy (voir
; AZ2_CABLAGE_MASTER.md), plus de 3e carte. Audit de code 2026-09-16 :
; source src_pico/ supprimee (le cablage/diagnostic reste documente en
; prose dans AZ2_CABLAGE_PICO.md, le code lui-meme reste consultable
; dans l'historique git si jamais utile de le retrouver).

; --- PICO KEYPAD (v2, reprise du 3e cerveau -- 2026-09-26) ---
; Diagnostic de cablage IS31FL3731 (voir docs/AZ2_CABLAGE_PICO_V2.md et le
; commentaire d'en-tete de src_pico/az2_keypad/main.cpp) : la carte en main
; est etiquetee A1-A9/B1-B9 (variante Adafruit "CharliePlex Breakout"),
; potentiellement pas cablee comme une matrice cathode-commune classique --
; ce firmware ecrit les registres du chip directement (pas de lib de haut
; niveau qui supposerait un cablage) et allume les 144 LED possibles une
; par une pour decouvrir empiriquement le vrai mapping. Hors default_envs
; (prototype/diagnostic, pas de production sur cette carte encore).
[env:pico_keypad]
platform = raspberrypi
board = pico
framework = arduino
build_flags =
    -D SERIAL_CDC
build_src_filter =
    -<*>
    +<../src_pico/az2_keypad/>
monitor_speed = 115200

; --- TESTS NATIFS (tournent sur cette machine, pas sur du materiel AZ-2) ---
; Ajoute le 2026-09-17 (audit de code, "Tests et integration continue :
; absents pour AZ-2, risque eleve") -- couvre la logique PURE de
; lib/AZ2_Protocol/AZ2_Protocol.h (encodage PROB:/COND:, tables division/
; moteur/pad) qui ne depend d'aucun peripherique. ArduinoFake fournit un
; Arduino.h factice pour que le header (ecrit pour Arduino) compile ici
; sans le modifier. Hors default_envs expres (pio test -e native, pas
; construit par un simple "pio run"). Voir test/test_protocol/.
[env:native]
platform = native
test_framework = unity
lib_deps =
    fabiobatsilva/ArduinoFake @ 0.4.0
build_flags =
    -std=gnu++17
    -Isrc_teensy/az2_audio
