; -------------------------------------------------------------------
; CONFIGURATION UNIFIEE AZ-2 (TEENSY 4.1 / ESP32-S3)
; -------------------------------------------------------------------

[platformio]
default_envs = master_teensy, screen_esp

; --- CONFIGURATION TEENSY (MOTEUR AUDIO + PCM5102A I2S) ---
[env:master_teensy]
; Version figee (2026-09-17, audit de code) : "platform = teensy" tout court
; suit silencieusement la derniere version publiee, ce qui peut casser un
; jour la compilation sans qu'on ait rien change ici. 6.0.0 = version
; installee et testee sur cette machine.
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_src_filter =
    -<*>
    +<../src_teensy/az2_audio/>
; Synth_Dexed est vendored dans le repo (portage MicroDexed-touch), pas sur
; le registre PlatformIO -- lib_extra_dirs l'expose a la LDF.
lib_extra_dirs =
    src_teensy/microdexed-touch/third-party
; usbMIDI vient directement du core Teensy avec USB_MIDI_SERIAL. L'ancienne
; dependance generique "MIDI" etait inutilisee et resolvait vers plusieurs
; paquets differents suivant le registre, donc build non reproductible.
lib_deps =
build_flags =
    -D USB_MIDI_SERIAL
    -D AZ2_ROLE_AUDIO
    -D I2S_AUDIO_ONLY
    ; FAT16/32 seulement (pas exFAT, valeur par defaut 3 = FAT+exFAT sur
    ; ARM -- voir SdFatConfig.h) : la carte SD des samples sera formatee
    ; FAT32 comme celle de l'ESP32 (voir AZ2_CABLAGE_MASTER.md), exFAT
    ; inutile -- plus petit, plus simple. (Note 2026-09-15 : soupconne
    ; un temps de corriger un bug d'upload separe, ce n'etait pas la
    ; cause -- voir extra_scripts/tools/ pour le vrai fix. Garde quand
    ; meme, bon choix independant.)
    -D SDFAT_FILE_TYPE=1
extra_scripts =
    pre:tools/build_teensy_loader.py
; 921600 depuis le 2026-09-18 (etait 230400) -- suit kControlBaud
; (AZ2_Protocol.h), utilise ici pour Serial ET Serial1 cote Teensy (voir
; setup()) : le port USB de debug tourne desormais a la meme vitesse que
; la liaison Serial1 vers l'ESP32.
monitor_speed = 921600

; --- ENGINE LAB FM2 (hors firmware de production) ---
; Banc monophonique isole pour mesurer un moteur FM deux operateurs avant
; toute integration au rack. Ne fait pas partie de default_envs.
[env:engine_lab_fm2]
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_src_filter =
    -<*>
    +<../src_teensy/engine_lab_fm2/>
lib_deps =
build_flags =
    -D USB_SERIAL
monitor_speed = 921600

; --- ESP32-S3-DEVKITC-1 NU : bring-up historique (2026-09-13), remplace par
; le duo screen_esp (ecran reel) + ctrl_pico (clavier/mux/LED/encodeurs) une
; fois le vrai module ecran en main -- garde comme reference/tests isoles,
; plus dans default_envs. ---
[env:ui_esp]
; Version figee (2026-09-17, audit de code) : "platform = espressif32" tout
; court resolvait de fait vers le fork pioarduino installe localement (voir
; env:screen_esp) -- ambigu et pas reproductible sur une autre machine.
; Explicite et identique a screen_esp pour que les deux environnements ESP32
; utilisent la meme version connue.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi ; Pour la PSRAM 8MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_control/>
; lvgl + Arduino_GFX pas encore utilises dans main.cpp (pas d'ecran cable/code
; pour l'instant). A remettre en lib_deps quand le prototype LVGL demarre
; (voir AZ2_ECRAN_FACADE.md, "Prochaine passe technique" #6) : au moment ou
; on les rajoute, verifier la compatibilite version Arduino core / Arduino_GFX
; (Arduino_GFX HEAD casse la compilation avec le core Arduino-ESP32 2.0.14 et
; 3.20017 ici: `esp32-hal-periman.h` introuvable dans les deux).
lib_deps =
build_flags =
    -D AZ2_ROLE_CONTROL
    -D BOARD_HAS_PSRAM
monitor_speed = 230400

; --- CONFIGURATION ESP32-S3 ECRAN (module VIEWE UEDX48480040E-WB-V1.3) ---
; Carte reelle identifiee le 2026-09-13 via l'etiquette sur le flex de
; l'ecran: VIEWE UEDX48480040E-WB-V1.3, driver GC9503V (pas le generique
; "ESP32-4848S040C_I / ST7701" suppose au depart). ESP32-S3 soude directement
; dessus (pas le DevKitC-1 nu de env:ui_esp). Voir AZ2_ECRAN_FACADE.md.
; ATTENTION: ce module n'a presque plus de GPIO libre une fois
; ecran+tactile+SD comptes (~GPIO19/20 dispo, voir AZ2_ECRAN_FACADE.md).
; Decision (2026-09-13): le clavier/mux/LED/encodeurs sont geres par un Pico
; dedie (env:ctrl_pico, 3e cerveau) qui parle directement au Teensy. Cet
; environnement ne cable donc que l'ecran + son propre lien UART vers le
; Teensy (GPIO19/20, pour les commandes issues du menu -- PAS GPIO1/2, qui
; sont en realite R3/R2 de l'ecran sur cette carte).
; Core Arduino-ESP32 3.x requis par Arduino_GFX (RGB panel + esp32-hal-periman.h,
; absent du core 2.0.x que fournit la plateforme officielle PlatformIO) -> fork
; communautaire pioarduino. Version figee au tag de release exact (2026-09-17,
; audit de code) : "stable" est un alias mouvant cote pioarduino, il peut
; pointer vers une release differente demain et casser le build sans qu'on
; ait touche a rien ici. 55.03.311 = version installee et testee sur cette
; machine (Arduino core 3.3.11 / ESP-IDF 5.5.5).
[env:screen_esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi ; Pour la PSRAM 8MB (module WROOM-1 N16R8)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_screen/>
; lvgl retire le 2026-09-17 (audit de code) : declare ici depuis le debut du
; projet mais jamais utilise (0 reference a lv_/lvgl.h dans az2_screen/, le
; menu/tracker/etc. sont dessines a la main via GFX Library for Arduino) --
; voir aussi include/lv_conf.h, supprime en meme temps.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
build_flags =
    -D AZ2_ROLE_SCREEN
    -D BOARD_HAS_PSRAM
    ; Son GB (minigb_apu, voir minigb_apu/) -- demande 2026-09-15
    ; ("faut un emulateur complet classe" + "envoyer sous forme de
    ; paquet ... pour que le DAC le joue"). minigb_apu.c est compile en
    ; unite de traduction SEPAREE de gb_audio.cpp (LDF PlatformIO) : ces
    ; deux macros doivent etre globales (build_flags), pas juste un
    ; #define local avant un #include, sinon minigb_apu.c ne les voit
    ; jamais. 14000 Hz depuis le 2026-09-18 (etait 8000, "tel-quality")
    ; -- palier A de AZ2_EMULATION_JEUX.md, rendu possible par le
    ; passage a 921600 bauds (voir kControlBaud, AZ2_Protocol.h). DOIT
    ; rester identique a az2::kGbAudioSampleRate (meme fichier) ET sous
    ; le plafond ~15200 Hz impose par le champ de longueur 1 octet du
    ; paquet audio (voir le commentaire de kGbAudioSampleRate) -- ne pas
    ; monter cette valeur sans elargir ce champ (protocole audio V2).
    -D MINIGB_APU_AUDIO_FORMAT_S16SYS
    -D AUDIO_SAMPLE_RATE=14000
monitor_speed = 230400

; --- GB DIRECT RGB INTEGRATION PROBE ---
; Same UI/emulator source as screen_esp, but Arduino_Canvas feeds the
; validated AZ2RgbDirect double framebuffer. The production target above is
; untouched until this variant is tested on hardware.
[env:screen_esp_gb_direct]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_screen/>
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
lib_extra_dirs = .pio/libdeps/screen_esp
build_flags =
    -D AZ2_ROLE_SCREEN
    -D AZ2_DIRECT_PANEL
    -D BOARD_HAS_PSRAM
    -D MINIGB_APU_AUDIO_FORMAT_S16SYS
    -D AUDIO_SAMPLE_RATE=14000
monitor_speed = 230400

; --- RGB DIRECT DOUBLE-FRAMEBUFFER PROBE ---
[env:screen_esp_rgb_direct_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_rgb_direct_probe/>
lib_deps =
lib_extra_dirs = .pio/libdeps/screen_esp
build_flags =
    -D AZ2_ROLE_SCREEN
    -D BOARD_HAS_PSRAM
monitor_speed = 230400

; --- A/B GNUBOY (probe video/CPU, separate GPLv2-compatible target) ---
; Kept outside default_envs and production source. This target is used to
; compare Retro-Go's GNUBOY core with the integrated Walnut-CGB emulator.
[env:screen_esp_gnuboy_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_gnuboy_probe/>
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
build_flags =
    -D AZ2_ROLE_SCREEN
    -D BOARD_HAS_PSRAM
monitor_speed = 230400

; --- PICO ABANDONNE (2026-09-14) ---
; 3e cerveau tente le 2026-09-13 (clavier : pads, mux LED, encodeurs) --
; abandonne apres un long diagnostic sans resoudre le mux LED (CD74HC4067
; jamais fonctionnel malgre EN/resistance/masses toutes verifiees, voir
; docs/AZ2_CABLAGE_PICO.md). Remplace par une croix + 4 boutons + 3
; encodeurs rotatifs cables DIRECTEMENT sur le Teensy (voir
; AZ2_CABLAGE_MASTER.md), plus de 3e carte. Audit de code 2026-09-16 :
; source src_pico/ supprimee (le cablage/diagnostic reste documente en
; prose dans AZ2_CABLAGE_PICO.md, le code lui-meme reste consultable
; dans l'historique git si jamais utile de le retrouver).

; --- TESTS NATIFS (tournent sur cette machine, pas sur du materiel AZ-2) ---
; Ajoute le 2026-09-17 (audit de code, "Tests et integration continue :
; absents pour AZ-2, risque eleve") -- couvre la logique PURE de
; lib/AZ2_Protocol/AZ2_Protocol.h (encodage PROB:/COND:, tables division/
; moteur/pad) qui ne depend d'aucun peripherique. ArduinoFake fournit un
; Arduino.h factice pour que le header (ecrit pour Arduino) compile ici
; sans le modifier. Hors default_envs expres (pio test -e native, pas
; construit par un simple "pio run"). Voir test/test_protocol/.
[env:native]
platform = native
test_framework = unity
lib_deps =
    fabiobatsilva/ArduinoFake @ 0.4.0
build_flags =
    -std=gnu++17
    -Isrc_teensy/az2_audio
