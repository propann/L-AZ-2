; -------------------------------------------------------------------
; CONFIGURATION UNIFIEE AZ-2 (TEENSY 4.1 / ESP32-S3)
; -------------------------------------------------------------------

[platformio]
default_envs = master_teensy, ui_esp

; --- CONFIGURATION TEENSY (MOTEUR AUDIO + PCM5102A I2S) ---
[env:master_teensy]
platform = teensy
board = teensy41
framework = arduino
build_src_filter =
    -<*>
    +<../src_teensy/az2_audio/>
lib_deps =
    MIDI
build_flags =
    -D USB_MIDI_SERIAL
    -D AZ2_ROLE_AUDIO
    -D I2S_AUDIO_ONLY
monitor_speed = 230400

; --- CONFIGURATION ESP32-S3 (ECRAN + MATRICE SPARKFUN 4X4) ---
[env:ui_esp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi ; Pour la PSRAM 8MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_control/>
lib_deps =
    lvgl/lvgl @ ^8.3.0
    https://github.com/moononournation/Arduino_GFX.git
build_flags =
    -D AZ2_ROLE_CONTROL
    -D BOARD_HAS_PSRAM
monitor_speed = 230400

; --- CONFIGURATION PICO (OPTION EXTENSION FACADE, HORS LIGNE PRINCIPALE) ---
[env:ctrl_pico]
platform = raspberrypi
board = pico
framework = arduino
build_src_filter =
    -<*>
    +<../src_pico/>
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    Wire
