board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<../src_esp32/az2_ngp_race/>
lib_deps =
    file:///home/azoth/L-AZ-2/.pio/libdeps/screen_esp/GFX Library for Arduino
lib_ignore = Unity
test_ignore = *
build_flags =
    -D AZ2_ROLE_SCREEN
    -D BOARD_HAS_PSRAM
    -D CZ80
    -O3
build_unflags =
    -Os
monitor_speed = 230400

; --- RGB DIRECT DOUBLE-FRAMEBUFFER PROBE ---
[env:screen_esp_rgb_direct_probe]
