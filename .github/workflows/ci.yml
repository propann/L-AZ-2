name: AZ-2 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: az2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==6.1.19
      - name: Check shared firmware contract
        run: python tools/check_firmware_contract.py
      - name: Check demo projects
        run: python tools/check_project_examples.py
      - name: Run native protocol tests
        run: pio test -e native

  firmware-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [master_teensy, master_teensy_rack_lab, screen_esp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==6.1.19
      - name: Compile firmware
        run: pio run -e ${{ matrix.environment }}
